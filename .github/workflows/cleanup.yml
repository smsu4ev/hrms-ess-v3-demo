name: Cleanup one-shot workflows
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Delete one-shot workflow files
        run: |
          set -euo pipefail
          rm -f .github/workflows/unzip.yml .github/workflows/cleanup.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "Clean up one-shot workflow files"
            git push
          fi

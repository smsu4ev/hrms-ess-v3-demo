name: Clean up one-shot workflow files

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Delete one-shot workflow files
        run: |
          rm -f .github/workflows/unzip.yml .github/workflows/cleanup.yml
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Clean up one-shot workflow files" || echo "nothing to commit"
          git push

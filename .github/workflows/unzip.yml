name: Unzip one-shot package
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract hrms-ess-v3.zip over repo root
        run: |
          set -euo pipefail
          test -f hrms-ess-v3.zip
          rm -rf /tmp/pkg
          mkdir -p /tmp/pkg
          unzip -o -q hrms-ess-v3.zip -d /tmp/pkg
          if [ "$(ls -A /tmp/pkg | wc -l)" = "1" ] && [ -d /tmp/pkg/hrms-ess-v3 ]; then
            SRC=/tmp/pkg/hrms-ess-v3
          else
            SRC=/tmp/pkg
          fi
          echo "Extracting from: $SRC"
          ls -la "$SRC" | head -30
          cp -a "$SRC"/. "$GITHUB_WORKSPACE"/
          rm -f "$GITHUB_WORKSPACE"/hrms-ess-v3.zip
          echo "hrms-ess-v3.zip removed"

      - name: Commit and push as github-actions bot
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "Deploy HRMS V3.10 HR Analytics: extract package contents to repo root (one-shot)"
            git push
          fi

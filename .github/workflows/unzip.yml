name: Unzip HRMS V3.8 package (one-shot)

on:
  workflow_dispatch:

jobs:
  unzip:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Extract zip over repo root
        run: |
          unzip -o hrms-ess-v3-v38.zip -d .
          rm -f hrms-ess-v3-v38.zip
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Deploy HRMS V3.8 soft-blue theme: extract updated code package (one-shot)" || echo "nothing to commit"
          git push

name: one-shot unzip extraction
on: push
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract zip contents to repo root
        run: |
          set -e
          ZIP=hrms-ess-v3.zip
          if [ ! -f "$ZIP" ]; then
            echo "zip not present, nothing to do"
            exit 0
          fi
          sudo apt-get install -y -qq unzip >/dev/null
          rm -rf /tmp/extract
          mkdir -p /tmp/extract
          unzip -q "$ZIP" -d /tmp/extract
          SRC=/tmp/extract
          # Descend into a single wrapping top-level folder, if present
          TOPDIRS=$(find "$SRC" -mindepth 1 -maxdepth 1 -type d | wc -l)
          TOPFILES=$(find "$SRC" -mindepth 1 -maxdepth 1 -type f | wc -l)
          if [ "$TOPDIRS" -eq 1 ] && [ "$TOPFILES" -eq 0 ]; then
            SRC=$(find "$SRC" -mindepth 1 -maxdepth 1 -type d | head -n 1)
          fi
          echo "=== extracted top-level contents ==="
          ls "$SRC"
          # Verify expected V3 markers exist before copying
          for f in run.py requirements.txt render.yaml app; do
            if [ ! -e "$SRC/$f" ]; then
              echo "ERROR: expected '$f' not found at top of zip"
              exit 1
            fi
          done
          shopt -s dotglob
          cp -r "$SRC"/* .
          rm -f "$ZIP"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Extract hrms-ess-v3.zip contents to repo root (one-shot)"
          rm -f .github/workflows/unzip.yml
          git add -A
          git commit -m "Remove one-shot extraction workflow"
          git push origin HEAD:main

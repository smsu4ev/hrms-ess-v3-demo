name: Unzip package into repo

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4
      - name: Extract hrms-ess-v3.zip over repo root
        run: |
          unzip -o hrms-ess-v3.zip -d .
          rm -f hrms-ess-v3.zip
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Extract hrms-ess-v3.zip contents to repo root (one-shot)" || echo "nothing to commit"
          git push

name: Unzip package into repo

on:
  workflow_dispatch:
    inputs:
      Attachment file:
        description: Zip file at the repo root to extract
        required: true
        default: hrms-ess-v3.zip

jobs:
  unzip:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Unzip package at repo root
        run: |
          unzip -o "${{ inputs['Attachment file'] }}" -d .
      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Extract ${{ inputs['Attachment file'] }} contents to repo root (one-shot)" || echo "Nothing to commit"
          git push

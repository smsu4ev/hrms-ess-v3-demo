name: Unzip HRMS V3.8 package (one-shot)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply V3.8 package contents to repo root
        run: |
          set -e
          if [ ! -d hrms-ess-v3 ]; then
            echo "hrms-ess-v3 folder not found at repo root" >&2
            exit 1
          fi
          rm -rf hrms-ess-v3/.git
          cp -rf hrms-ess-v3/. .
          rm -rf hrms-ess-v3
          echo "Repo root after applying package:"
          ls -la
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Deploy HRMS V3.8 soft-blue theme: apply package contents to repo root (one-shot)" || echo "nothing to commit"
          git push

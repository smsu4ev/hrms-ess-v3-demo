name: Unzip one-shot deploy package

on:
  workflow_dispatch:

jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract hrms-ess-v3.zip over repo root
        run: |
          unzip -o hrms-ess-v3.zip -d "$GITHUB_WORKSPACE"
          rm -f hrms-ess-v3.zip

      - name: Commit and push extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Deploy HRMS V3.7 App UI: extract updated code package (one-shot)" || echo "No changes to commit"
          git push

name: Extract HRMS V3.2 package (one-shot)

on:
  push:
    paths:
      - 'hrms-ess-v3.zip'

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Mirror zip contents over repo root (keep .github)
        run: |
          python3 - <<'PYEOF'
          import zipfile, pathlib, shutil
          root = pathlib.Path('.')
          pkg = pathlib.Path('/tmp/pkg')
          if pkg.exists():
              shutil.rmtree(pkg)
          pkg.mkdir(parents=True)
          with zipfile.ZipFile('hrms-ess-v3.zip') as z:
              members = [m for m in z.infolist()
                         if m.filename != '.github' and not m.filename.startswith('.github/')]
              z.extractall(pkg, members=members)
          src = pkg
          if not (src / 'render.yaml').exists():
              sub = [d for d in src.iterdir() if d.is_dir() and (d / 'render.yaml').exists()]
              if sub:
                  src = sub[0]
              else:
                  raise SystemExit('render.yaml not found in package')
          keep = {'.git', '.github', 'instance', 'hrms-ess-v3.zip'}
          for item in root.iterdir():
              if item.name in keep:
                  continue
              if item.is_dir() and not item.is_symlink():
                  shutil.rmtree(item)
              else:
                  item.unlink()
          for item in src.iterdir():
              dest = root / item.name
              if item.is_dir() and not item.is_symlink():
                  shutil.copytree(item, dest, dirs_exist_ok=True)
              else:
                  shutil.copy2(item, dest)
          print('repo root now:')
          for item in sorted(root.iterdir()):
              print(' ', item.name)
          PYEOF

      - name: Commit V3.2 and remove one-shot files
        run: |
          rm -f hrms-ess-v3.zip .github/workflows/extract.yml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short | head -100
          git commit -m "Deploy HRMS V3.2: extract updated code package (one-shot)" || echo "nothing to commit"
          git push

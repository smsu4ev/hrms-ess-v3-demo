name: Clean up one-shot workflow files

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Remove one-shot workflow files
        run: |
          rm -f .github/workflows/unzip-package.yml .github/workflows/cleanup-one-shot.yml
          rmdir -p .github/workflows 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short | head -50
          git commit -m "Clean up one-shot workflow files" || echo "nothing to commit"
          git push

{% extends "base.html" %}
{% block title %}Letter{% endblock %}
{% block content %}
<div class="slip">
<h2>{{ letter.template.name if letter.template else 'Letter' }}</h2>
<p><strong>{{ user.name }}</strong> ({{ user.id }}) - generated {{ letter.created_at.strftime('%Y-%m-%d') }}</p>
<div class="formcard">
<pre style="white-space:pre-wrap; font-family:inherit;">{{ letter.rendered_text }}</pre>
</div>
<button class="btn" onclick="window.print()">Print / Save PDF</button>
<a class="btn" href="{{ url_for('payroll.letters') }}">Back</a>
</div>
{% endblock %}

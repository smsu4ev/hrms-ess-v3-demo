<svg xmlns="http://www.w3.org/2000/svg" width="560" height="560" viewBox="0 0 560 560">
  <!-- WhatsApp-doodle-style wallpaper: retail-fixture industry line doodles.
       Pale-cream base is provided by CSS; strokes are dark at low opacity so
       text over the pattern stays readable. Seamless-safe: all doodles sit
       inside 30px margins. -->
  <g fill="none" stroke="#0f172a" stroke-opacity="0.5" stroke-width="2.2"
     stroke-linecap="round" stroke-linejoin="round">

    <!-- 1 gondola shelving unit: uprights + 3 shelves -->
    <g transform="translate(62,58) rotate(-8)">
      <path d="M-14,-18 V18 M14,-18 V18 M-14,-10 H14 M-14,0 H14 M-14,10 H14"/>
    </g>

    <!-- 2 wall display rack with hooks -->
    <g transform="translate(166,62) rotate(10)">
      <path d="M-12,-16 V16 M-12,-8 H6 M-12,0 H8 M-12,8 H6"/>
      <circle cx="8" cy="-8" r="2"/><circle cx="10" cy="0" r="2"/><circle cx="8" cy="8" r="2"/>
    </g>

    <!-- 3 shopping trolley -->
    <g transform="translate(284,60) rotate(-12)">
      <path d="M-16,-8 L-12,8 H12 L16,-8 M16,-8 L22,-14"/>
      <circle cx="-8" cy="13" r="2.5"/><circle cx="8" cy="13" r="2.5"/>
    </g>

    <!-- 4 clothes hanger -->
    <g transform="translate(394,58) rotate(8)">
      <path d="M-16,8 L0,-6 L16,8 M-16,8 H16"/>
      <path d="M0,-6 c0,-6 8,-6 8,-1 c0,3 -4,4 -6,2"/>
    </g>

    <!-- 5 price tag -->
    <g transform="translate(498,62) rotate(-10)">
      <path d="M-6,-14 L8,-14 L16,-6 V10 H-6 Z"/>
      <circle cx="-1" cy="-8" r="2"/>
    </g>

    <!-- 6 storefront with striped awning -->
    <g transform="translate(58,166) rotate(6)">
      <path d="M-16,-4 H16 V14 H-16 Z"/>
      <path d="M-18,-4 q18,-14 36,0 l-2,6 h-32 Z"/>
      <path d="M-12,2 V-4 M-4,2 V-4 M4,2 V-4 M12,2 V-4"/>
    </g>

    <!-- 7 mannequin -->
    <g transform="translate(168,170) rotate(-6)">
      <circle cx="0" cy="-13" r="5"/>
      <path d="M0,-8 L-8,-2 L-6,12 H6 L8,-2 Z"/>
      <path d="M0,12 V18 M-6,18 H6"/>
    </g>

    <!-- 8 POS counter with till -->
    <g transform="translate(282,168) rotate(12)">
      <path d="M-16,2 H16 V14 H-16 Z"/>
      <path d="M-8,-12 H4 V2 H-8 Z M-4,-6 H0"/>
      <path d="M-4,2 V4 M-2,2 V4"/>
    </g>

    <!-- 9 cardboard box -->
    <g transform="translate(394,170) rotate(-14)">
      <path d="M-14,-6 H14 V10 H-14 Z"/>
      <path d="M-14,-6 L-8,-13 H8 L14,-6 M-8,-13 V-6 M8,-13 V-6"/>
    </g>

    <!-- 10 wooden pallet -->
    <g transform="translate(500,168) rotate(8)">
      <path d="M-16,-6 H16 M-16,-1 H16 M-16,4 H16"/>
      <path d="M-12,-2 V10 M12,-2 V10 M-16,10 H16"/>
    </g>

    <!-- 11 delivery truck -->
    <g transform="translate(60,282) rotate(-10)">
      <path d="M-16,-8 H6 V8 H-16 Z"/>
      <path d="M6,-8 H12 L16,-2 V8 H6"/>
      <circle cx="-9" cy="11" r="3"/><circle cx="9" cy="11" r="3"/>
    </g>

    <!-- 12 forklift -->
    <g transform="translate(166,278) rotate(8)">
      <path d="M-14,-2 H2 V12 H-14 Z"/>
      <path d="M6,-14 V12 M6,12 H18"/>
      <path d="M-14,-2 L-10,-12 H0 V-2"/>
      <circle cx="-8" cy="15" r="3"/>
    </g>

    <!-- 13 hard-hat smiley -->
    <g transform="translate(284,280)">
      <circle cx="0" cy="2" r="13"/>
      <path d="M-13,-6 Q0,-21 13,-6 M-15,-6 H15"/>
      <path d="M-7,6 Q0,12 7,6"/>
      <circle cx="-5" cy="0" r="1.4" fill="#0f172a" fill-opacity="0.5" stroke="none"/>
      <circle cx="5" cy="0" r="1.4" fill="#0f172a" fill-opacity="0.5" stroke="none"/>
    </g>

    <!-- 14 plain smiley -->
    <g transform="translate(392,282) rotate(-6)">
      <circle cx="0" cy="0" r="13"/>
      <path d="M-7,4 Q0,11 7,4"/>
      <circle cx="-5" cy="-2" r="1.4" fill="#0f172a" fill-opacity="0.5" stroke="none"/>
      <circle cx="5" cy="-2" r="1.4" fill="#0f172a" fill-opacity="0.5" stroke="none"/>
    </g>

    <!-- 15 winking smiley -->
    <g transform="translate(500,280) rotate(10)">
      <circle cx="0" cy="0" r="13"/>
      <path d="M-7,4 Q0,11 7,4 M3,-3 H8"/>
      <circle cx="-5" cy="-3" r="1.4" fill="#0f172a" fill-opacity="0.5" stroke="none"/>
    </g>

    <!-- 16 wrench -->
    <g transform="translate(62,394) rotate(12)">
      <path d="M-6,-12 a9,9 0 1 0 12,0"/>
      <path d="M2,-6 L-12,12 M-9,6 l-3,3"/>
    </g>

    <!-- 17 hammer -->
    <g transform="translate(168,390) rotate(-10)">
      <path d="M-12,-12 H6 V-2 H-12 Z M-12,-8 L-18,-12"/>
      <path d="M0,-2 V16"/>
    </g>

    <!-- 18 screwdriver -->
    <g transform="translate(280,394) rotate(6)">
      <path d="M-6,4 H6 V14 a2,2 0 0 1 -2,2 H-4 a2,2 0 0 1 -2,-2 Z"/>
      <path d="M-1,4 V-12 M-2,-12 H2"/>
    </g>

    <!-- 19 welding spark burst -->
    <g transform="translate(394,392)">
      <circle cx="0" cy="0" r="1.6" fill="#0f172a" fill-opacity="0.5" stroke="none"/>
      <path d="M0,-6 V-14 M0,6 V14 M-6,0 H-14 M6,0 H14 M-5,-5 L-10,-10 M5,-5 L10,-10 M-5,5 L-10,10 M5,5 L10,10"/>
    </g>

    <!-- 20 tape measure -->
    <g transform="translate(498,394) rotate(-8)">
      <path d="M-14,-8 H10 a6,6 0 0 1 6,6 v4 a6,6 0 0 1 -6,6 H-14 Z"/>
      <path d="M16,4 H26 M-10,0 H4"/>
    </g>

    <!-- 21 steel pipe elbow -->
    <g transform="translate(60,500) rotate(8)">
      <path d="M-12,12 V2 Q-12,-12 2,-12 H12"/>
      <path d="M-4,12 V2 Q-4,-4 2,-4 H12"/>
    </g>

    <!-- 22 gear -->
    <g transform="translate(168,498) rotate(-8)">
      <circle cx="0" cy="0" r="9"/><circle cx="0" cy="0" r="3.5"/>
      <path d="M0,-9 V-14 M0,9 V14 M-9,0 H-14 M9,0 H14 M-6,-6 L-10,-10 M6,-6 L10,-10 M-6,6 L-10,10 M6,6 L10,10"/>
    </g>

    <!-- 23 light bulb -->
    <g transform="translate(280,500) rotate(10)">
      <circle cx="0" cy="-4" r="10"/>
      <path d="M-5,8 H5 M-4,12 H4"/>
      <path d="M-3,-2 Q0,-8 3,-2"/>
    </g>

    <!-- 24 star -->
    <g transform="translate(392,498) rotate(-6)">
      <path d="M0,-13 L3.8,-4.7 L12.4,-4.7 L5.9,0.6 L8.5,9.3 L0,4 L-8.5,9.3 L-5.9,0.6 L-12.4,-4.7 L-3.8,-4.7 Z"/>
    </g>

    <!-- 25 heart -->
    <g transform="translate(496,502) rotate(8)">
      <path d="M0,8 C-14,-2 -8,-12 0,-5 C8,-12 14,-2 0,8 Z"/>
    </g>

    <!-- 26 checkmark badge -->
    <g transform="translate(132,500) rotate(-10)">
      <circle cx="0" cy="0" r="13"/>
      <path d="M-6,0 L-2,6 L8,-6"/>
    </g>
  </g>
</svg>

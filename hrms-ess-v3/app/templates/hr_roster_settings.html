{% extends "base.html" %}
{% block title %}Roster Settings{% endblock %}
{% block content %}
<h2>Roster Settings</h2>
<p class="muted">Ramadan reduced hours and the summer midday-break window shown as banners on the roster.</p>
<div class="formcard">
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <h3>Ramadan</h3>
    <label>Ramadan start <input type="date" name="ramadan_start" value="{{ s.ramadan_start.isoformat() if s.ramadan_start else '' }}"></label>
    <label>Ramadan end <input type="date" name="ramadan_end" value="{{ s.ramadan_end.isoformat() if s.ramadan_end else '' }}"></label>
    <label>Ramadan daily hours threshold <input type="number" step="0.5" min="0" name="ramadan_daily_hours" value="{{ s.ramadan_daily_hours }}"></label>
    <label>Standard daily hours <input type="number" step="0.5" min="0" name="standard_daily_hours" value="{{ s.standard_daily_hours }}"></label>
    <h3>Summer midday break</h3>
    <label>Break start <input type="time" name="midday_break_start" value="{{ s.midday_break_start }}"></label>
    <label>Break end <input type="time" name="midday_break_end" value="{{ s.midday_break_end }}"></label>
    <label>Season start (MM-DD) <input type="text" name="midday_season_start_md" value="{{ s.midday_season_start_md }}" maxlength="5" placeholder="06-15"></label>
    <label>Season end (MM-DD) <input type="text" name="midday_season_end_md" value="{{ s.midday_season_end_md }}" maxlength="5" placeholder="09-15"></label>
    <button class="btn primary" type="submit">Save Settings</button>
    <a class="btn" href="{{ url_for('roster.roster') }}">Back to roster</a>
  </form>
</div>
{% endblock %}

{# Professional inline SVG line icons (stroke=currentColor, 24px grid).
   Replaces the old emoji "smiley" menu icons. No emoji characters anywhere. #}
{% macro icon(name) -%}
<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
{%- if name == 'home' -%}
<path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/><path d="M9 21v-6h6v6"/>
{%- elif name == 'calendar' -%}
<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 3v4M16 3v4M3 10h18"/>
{%- elif name == 'clock' -%}
<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>
{%- elif name == 'pencil' -%}
<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/>
{%- elif name == 'card' -%}
<rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20"/>
{%- elif name == 'chat' -%}
<path d="M21 11.5a8.5 8.5 0 0 1-8.5 8.5c-1.6 0-3.1-.4-4.3-1.1L3 20l1.1-4.2A8.5 8.5 0 1 1 21 11.5z"/>
{%- elif name == 'star' -%}
<path d="M12 2.5l2.9 6.3 6.9.8-5.1 4.7 1.4 6.8L12 17.7l-6.1 3.4 1.4-6.8L2.2 9.6l6.9-.8z"/>
{%- elif name == 'user' -%}
<circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-3.8 4.7-5.5 8-5.5s6.5 1.7 8 5.5"/>
{%- elif name == 'file' -%}
<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/>
{%- elif name == 'money' -%}
<circle cx="12" cy="12" r="9"/><path d="M14.8 9.2c-.5-.9-1.6-1.4-2.8-1.4-1.7 0-3 1-3 2.6 0 1.5 1.2 2.2 3 2.6 1.8.4 3 1 3 2.6 0 1.6-1.3 2.6-3 2.6-1.2 0-2.3-.5-2.8-1.4M12 6v12"/>
{%- elif name == 'check' -%}
<path d="M20 6 9 17l-5-5"/>
{%- elif name == 'chart' -%}
<path d="M3 3v18h18"/><path d="M8 17v-5M13 17V8M18 17v-3"/>
{%- elif name == 'stopwatch' -%}
<circle cx="12" cy="13.5" r="7.5"/><path d="M12 10v3.5l2.5 2M9.5 2.5h5M12 2.5V6"/>
{%- elif name == 'building' -%}
<rect x="4" y="3" width="16" height="18" rx="1"/><path d="M9 21v-4h6v4"/><path d="M8 7h2M8 11h2M14 7h2M14 11h2"/>
{%- elif name == 'download' -%}
<path d="M12 3v12"/><path d="m7 11 5 5 5-5"/><path d="M4 21h16"/>
{%- elif name == 'mail' -%}
<rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-10 6L2 7"/>
{%- elif name == 'users' -%}
<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c1.2-3.3 3.6-5 6.5-5s5.3 1.7 6.5 5"/><circle cx="17" cy="9" r="2.5"/><path d="M16.5 15.3c2.7.4 4.6 1.8 5.5 4.7"/>
{%- elif name == 'scales' -%}
<path d="M12 3v18"/><path d="M5 7h14"/><path d="M5 7 3 14a2.8 2.8 0 0 0 4 0L5 7z"/><path d="M19 7l-2 7a2.8 2.8 0 0 0 4 0l-2-7z"/><path d="M8 21h8"/>
{%- elif name == 'clipboard' -%}
<rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4a3 3 0 0 1 6 0"/><path d="M9 11h6M9 15h4"/>
{%- elif name == 'graduation' -%}
<path d="m22 9-10-5L2 9l10 5 10-5z"/><path d="M6 11.5V16c0 1.7 2.7 3 6 3s6-1.3 6-3v-4.5"/><path d="M22 9v5"/>
{%- elif name == 'phone' -%}
<path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 2 .7 2.9a2 2 0 0 1-.5 2.1L8.1 10a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.9.5 2.9.7a2 2 0 0 1 1.6 2z"/>
{%- elif name == 'menu' -%}
<path d="M4 6h16M4 12h16M4 18h16"/>
{%- elif name == 'report' -%}
<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M9 13h6M9 17h6"/>
{%- elif name == 'idcard' -%}
<rect x="2" y="4" width="20" height="16" rx="2"/><circle cx="8.5" cy="11" r="2"/><path d="M6 16.5c.6-1.7 1.9-2.5 4-2.5M14 9.5h5M14 13h5"/>
{%- elif name == 'medal' -%}
<circle cx="12" cy="9" r="5.5"/><path d="M9.2 13.8 7 22l5-2.5L17 22l-2.2-8.2"/><path d="m12 6.6 1 2 2.2.3-1.6 1.5.4 2.2-2-1-2 1 .4-2.2-1.6-1.5 2.2-.3z"/>
{%- elif name == 'briefcase' -%}
<rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 7V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2"/><path d="M2 13h20"/>
{%- elif name == 'truck' -%}
<rect x="1" y="4" width="15" height="12" rx="1"/><path d="M16 8h4l3 4v4h-7"/><circle cx="5.5" cy="18.5" r="2"/><circle cx="17.5" cy="18.5" r="2"/>
{%- elif name == 'shirt' -%}
<path d="M9 3 3.5 6.5 5.5 11l3.5-1.5V21h6V9.5L18.5 11l2-4.5L15 3a3 3 0 0 1-6 0z"/>
{%- elif name == 'alert' -%}
<path d="M12 3 2 20h20z"/><path d="M12 9.5V14"/><path d="M12 17.5v.1"/>
{%- elif name == 'usercheck' -%}
<circle cx="10" cy="8" r="4"/><path d="M2.5 20.5c1.4-3.6 4.2-5.3 7.5-5.3 1.6 0 3.1.4 4.3 1.2"/><path d="m15.5 12 2 2 4-4.5"/>
{%- elif name == 'logout' -%}
<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/>
{%- elif name == 'absent' -%}
<circle cx="10" cy="8" r="4"/><path d="M2.5 20.5c1.4-3.6 4.2-5.3 7.5-5.3 1.2 0 2.3.2 3.3.7"/><path d="m16.5 12 5 5M21.5 12l-5 5"/>
{%- elif name == 'bell' -%}
<path d="M18 8a6 6 0 1 0-12 0c0 7-3 8-3 8h18s-3-1-3-8"/><path d="M10.3 21a2 2 0 0 0 3.4 0"/>
{%- else -%}
<circle cx="12" cy="12" r="8"/>
{%- endif -%}
</svg>
{%- endmacro %}

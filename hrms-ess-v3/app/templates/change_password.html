{% extends "base.html" %}
{% block title %}Change Password{% endblock %}
{% block content %}
<div class="authcard" style="margin: 40px auto;">
  <h1>{% if first_login %}Set Your New Password{% else %}Change Password{% endif %}</h1>
  <p class="sub">Minimum 8 characters, with uppercase, lowercase and a digit.</p>
  {% if error %}<div class="flash error">{{ error }}</div>{% endif %}
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>Current password
      <input type="password" name="current_password" autocomplete="current-password" required>
    </label>
    <label>New password
      <input type="password" name="new_password" autocomplete="new-password" required>
    </label>
    <label>Confirm new password
      <input type="password" name="confirm_password" autocomplete="new-password" required>
    </label>
    <button type="submit" class="btn primary wide">Change Password</button>
  </form>
</div>
{% endblock %}

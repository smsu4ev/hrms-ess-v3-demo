server {
    listen 80;
    server_name hrms.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name hrms.example.com;

    # Filled by certbot --nginx (or paste your fullchain/privkey paths here)
    # ssl_certificate /etc/letsencrypt/live/hrms.example.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/hrms.example.com/privkey.pem;

    client_max_body_size 16m;

    location /static/ {
        alias /opt/hrms-ess/hrms-ess-v2/app/static/;
        expires 7d;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
